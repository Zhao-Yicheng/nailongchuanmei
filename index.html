<html lang="zh-CN">
<head>

<!-- 有 JS 时先播开场动画再显示校区；没有 JS 时直接显示校区 -->
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #fffbef;
    --fg: #3a2c00;
    --muted: #8f7a45;
    --ink: #fece0e;
    --track: rgba(254, 206, 14, .22);
    --card: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15120a;
      --fg: #f6edd0;
      --muted: #a8996c;
      --track: rgba(254, 206, 14, .16);
      --card: #221d12;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px 56px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.choosing { cursor: default; }
  html:not(.js) main { display: none; }
  main {
    display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center;
    transition: opacity .45s ease-in, transform .45s ease-in;
  }
  .choosing main { opacity: 0; transform: scale(1.08); pointer-events: none; }

  /* 开场：校徽条（左字不动）+ 红色校徽从左到右变奶龙黄，下方进度条 */
  .brand { width: clamp(260px, 64vw, 430px); }
  .logo-box { position: relative; }
  .logo-box picture { display: block; }
  .logo-box img { display: block; width: 100%; height: auto; }
  .sweep-pic { position: absolute; inset: 0; }
  .sweep { clip-path: inset(0 100% 0 0); }
  .base-pic { clip-path: inset(0 0 0 0); }
  .bar-track { height: 4px; margin-top: 22px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar { display: block; height: 100%; border-radius: inherit; background: var(--ink); transform: scaleX(0); transform-origin: 0 50%; }

  .copy { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  h1 { font-size: clamp(26px, 7vw, 40px); font-weight: 800; letter-spacing: .12em; padding-left: .12em; }
  .status { font-size: clamp(14px, 4vw, 17px); }
  .dots i {
    display: inline-block; width: .3em; height: .3em; margin-left: .18em;
    border-radius: 50%; background: currentColor; vertical-align: middle;
    animation: dot 1s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .hint { font-size: 13px; color: var(--muted); }

  /* 选校区：从屏幕中心出发、两两夹角 360°/N 的 N 条射线把屏幕分成 N 块，整个「转盘」缓慢旋转。
     每块是一个铺满全屏的链接，用 clip-path 裁成扇形（顶点伸到 150vmax 外，任何屏幕比例都能盖满），
     裁掉的部分不响应点击。截图和标签做等速反向旋转，看起来不动，像 N 扇窗户绕着中心转。
     旋转用 rotate/scale/translate 独立属性，才能和 hover、离场的缩放叠加。 */
  /* --spin-at（0~1）由脚本每次开场随机设置：所有旋转动画用同一个负延迟，从随机角度开始且保持同步 */
  .sectors { --period: 160s; --spin-delay: calc(var(--period) * var(--spin-at, 0) * -1); position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #15120a; }
  .js .sectors { opacity: 0; visibility: hidden; transition: opacity .6s ease .2s, visibility 0s .8s; }
  .choosing .sectors { opacity: 1; visibility: visible; transition: opacity .6s ease .2s, visibility 0s; }
  .wheel { position: absolute; inset: 0; }
  .choosing .wheel { animation: spin var(--period) linear var(--spin-delay) infinite; }
  .sector { position: absolute; inset: 0; color: #fff; text-decoration: none; cursor: pointer; outline: none; background-size: cover; background-position: center; }

  /* 截图铺满全屏、反向旋转保持不动；扇区转到哪里就透出哪里。
     模糊占位底图以 CSS 背景内联（零请求，首屏即渲染），清晰截图加载完后淡入盖上 */
  .sector img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
    filter: brightness(.78); transition: filter .35s, scale .9s cubic-bezier(.2, .7, .2, 1), opacity .9s ease;
  }
  .sector img.loaded { opacity: 1; }
  html:not(.js) .sector img { opacity: 1; }
  .js .sector img { scale: 1.08; }
  .choosing .sector img { scale: 1; animation: unspin var(--period) linear var(--spin-delay) infinite; }
  .sector:hover img, .sector:focus-visible img { filter: none; scale: 1.03; }
  .sectors:hover .sector:not(:hover) img { filter: brightness(.5) saturate(.7); }

  /* 标签放在扇区中线上、离中心 --d，跟着转盘绕中心公转，同时反向自转保持正立 */
  .sector-label {
    --d: 27vmin;
    position: absolute; translate: -50% -50%;
    padding: 10px 20px; border-radius: 14px; text-align: center; white-space: nowrap;
    background: rgba(20, 16, 5, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: background-color .25s, color .25s, scale .25s;
  }
  .choosing .sector-label { animation: unspin var(--period) linear var(--spin-delay) infinite; }
  .sector-label small { display: block; font-size: clamp(12px, 1vw, 14px); letter-spacing: .08em; opacity: .8; }
  .sector-label b { display: block; font-size: clamp(18px, 3vw, 34px); letter-spacing: .1em; }
  .sector:hover .sector-label, .sector:focus-visible .sector-label, .sector.picked .sector-label {
    background: var(--ink); color: #3a2c00; scale: 1.06;
  }

  .ray {
    position: absolute; left: 50%; top: 50%; width: 150vmax; height: 4px; margin-top: -2px;
    background: var(--ink); box-shadow: 0 0 10px rgba(0, 0, 0, .45);
    transform-origin: 0 50%; transform: rotate(var(--a)); pointer-events: none;
  }
  .js .ray { transform: rotate(var(--a)) scaleX(0); }
  .choosing .ray { animation: ray .7s cubic-bezier(.2, .7, .2, 1) .3s forwards; }
  .hub {
    position: absolute; left: 50%; top: 50%; width: clamp(220px, 38vmin, 360px); aspect-ratio: 372 / 64;
    border-radius: 10px; pointer-events: none;
    background: url(assets/logo-yellow.png) center / auto 78% no-repeat #fff;
    box-shadow: 0 0 14px 6px rgba(255, 255, 255, .9);
    transform: translate(-50%, -50%);
  }
  .js .hub { transform: translate(-50%, -50%) scale(0); }
  .choosing .hub { animation: hub .5s cubic-bezier(.34, 1.56, .64, 1) .2s forwards; }

  /* 选中后：其他块淡出，选中的那块放大，然后跳转 */
  .sector { transition: opacity .35s; }
  .leaving .sector:not(.picked), .leaving .ray, .leaving .hub { opacity: 0; transition: opacity .35s; }
  .leaving .sector.picked img { filter: none; scale: 1.1; }

  /* 右下角「关于」：开场阶段打开时暂停倒计时 */
  .about-btn {
    position: fixed; z-index: 2; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
    padding: 8px 10px; border: 0; border-radius: 999px; background: none; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    transition: color .2s, background-color .2s, text-decoration-color .2s, opacity .3s;
  }
  .about-btn:hover, .about-btn:focus-visible { color: var(--fg); text-decoration-color: currentColor; }
  .choosing .about-btn { padding: 6px 14px; background: rgba(20, 16, 5, .6); color: #fff; }
  .leaving .about-btn { opacity: 0; }
  .about {
    width: min(360px, calc(100vw - 32px)); margin: auto; padding: 0; border: 0; border-radius: 16px;
    background: var(--card); color: var(--fg); box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
    cursor: auto; user-select: text;
  }
  .about[open] { animation: rise .25s ease-out; }
  .about::backdrop { background: rgba(20, 16, 5, .45); backdrop-filter: blur(3px); }
  .about-body { padding: 24px 22px 18px; }
  .about h2 { font-size: 18px; margin-bottom: 12px; }
  .about p { font-size: 14px; line-height: 1.7; }
  .about p + p { margin-top: 8px; }
  .about del { color: var(--muted); text-decoration-thickness: 4px; }
  .about code {
    padding: 1px 6px; border-radius: 6px; background: var(--track);
    font: inherit; font-weight: 700; white-space: nowrap;
  }
  .about form { margin-top: 18px; text-align: right; }
  .about form button {
    padding: 8px 18px; border: 0; border-radius: 999px; background: var(--ink); color: #3a2c00;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* 阶段A（.run）：进度条爬向前 30%，等待两张 logo 解码；logo 藏着不出场 */
  .run .brand { opacity: 0; }
  .run .bar { animation: fillA 3.5s ease-out forwards; }
  .run .copy { animation: rise .5s ease-out .15s backwards; }
  /* 阶段B（.ready）：logo 解码完成 → 进度条走完剩余 70%（固定时长），logo 同步登场、同步结束 */
  .ready .brand { opacity: 1; animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) backwards; }
  .ready .bar { animation: fillbar var(--delay) linear forwards; }
  .ready .sweep { animation: sweep var(--delay) cubic-bezier(.4, 0, .2, 1) forwards; }
  .ready .base-pic { animation: hidebase var(--delay) cubic-bezier(.4, 0, .2, 1) forwards; }
  .paused .bar, .paused .sweep, .paused .base-pic { animation-play-state: paused; }

  @keyframes pop { from { transform: scale(.55) rotate(-25deg); opacity: 0; } }
  @keyframes sweep { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes hidebase { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
  @keyframes fillA { to { transform: scaleX(.3); } }
  @keyframes fillbar { from { transform: scaleX(var(--bar-from, 0)); } to { transform: scaleX(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes dot { 0%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-.25em); } }
  @keyframes ray { to { transform: rotate(var(--a)) scaleX(1); } }
  @keyframes hub { to { transform: translate(-50%, -50%) scale(1); } }
  @keyframes spin { to { rotate: 360deg; } }
  @keyframes unspin { to { rotate: -360deg; } }

  @media (prefers-reduced-motion: reduce) {
    .run .bar { animation: none; }
    .run .brand, .ready .brand { opacity: 1; }
    .run .brand, .run .sweep, .run .base-pic, .run .copy, .ready .sweep, .ready .base-pic, .dots i, .about[open] { animation: none; }
    .ready .sweep { clip-path: inset(0 0 0 0); } /* 减动效：直接显示黄色成品 */
    .ready .base-pic { clip-path: inset(0 0 0 100%); } /* 减动效：红底直接隐藏 */
    .choosing .ray { animation: none; transform: rotate(var(--a)); }
    .choosing .hub { animation: none; transform: translate(-50%, -50%); }
    main, .sectors, .sector, .sector img, .sector-label { transition: none !important; }
    /* 不转，但保留动画并暂停：带着随机负延迟停住，就是一个随机的静止角度 */
    .choosing .wheel, .choosing .sector img, .choosing .sector-label { animation-play-state: paused; }
    .js .sector img, .sector:hover img, .leaving .sector.picked img { scale: none; }
  }
</style>
</head>
<body>
<main>
  <div class="wrap" aria-hidden="true">
    <div class="brand">
      <div class="logo-box">
        <picture class="base-pic">
          <source media="(prefers-color-scheme: dark)" srcset="assets/logo-dark.png">
          <img class="logo" src="assets/logo.png" alt="" width="326" height="57">
        </picture>
        <picture class="sweep-pic">
          <source media="(prefers-color-scheme: dark)" srcset="assets/logo-dark-yellow.png">
          <img class="logo sweep" src="assets/logo-yellow.png" alt="" width="372" height="64">
        </picture>
      </div>
      <div class="bar-track"><i class="bar"></i></div>
    </div>
  </div>
  <div class="copy">
    <h1>奶龙传媒学院</h1>
    <p class="status">奶龙正在护送你前往 <strong>奶龙传媒学院</strong><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
    <p class="hint" id="hint">立即前往</p>
  </div>
</main>
<nav class="sectors" aria-label="选择校区">
  <div class="wheel">
    <!-- 无 JS 时的静态兜底：默认两个校区（与下方 CAMPUSES 配置一致） -->
    <a class="sector" href="https://mtgc.cuz.edu.cn/" aria-label="奶龙传媒学院媒体工程学院"
       style="clip-path: polygon(50% 50%, calc(50% - 150vmax) 50%, 50% calc(50% - 150vmax), calc(50% + 150vmax) 50%)">
      <img src="assets/campus-mtgc.webp" alt="" width="1920" height="1090">
      <span class="sector-label" style="left: 50%; top: calc(50% - 27vmin)"><small>奶龙传媒学院</small><b>媒体工程学院</b></span>
    </a>
    <a class="sector" href="https://www.cuz.edu.cn/" aria-label="奶龙传媒学院总校官网"
       style="clip-path: polygon(50% 50%, calc(50% + 150vmax) 50%, 50% calc(50% + 150vmax), calc(50% - 150vmax) 50%)">
      <img src="assets/campus-cuz.webp" alt="" width="1920" height="1090">
      <span class="sector-label" style="left: 50%; top: calc(50% + 27vmin)"><small>奶龙传媒学院</small><b>总校官网</b></span>
    </a>
    <i class="ray" style="--a: 180deg"></i>
    <i class="ray" style="--a: 0deg"></i>
  </div>
  <span class="hub"></span>
</nav>
<button class="about-btn" id="about-btn" type="button" hidden>关于</button>
<dialog class="about" id="about" aria-labelledby="about-title">
  <div class="about-body">
    <h2 id="about-title">关于本站</h2>
    <p>本站为奶龙站点：打开 www.奶龙传媒学院.com，会先加载此页面，把你送到大连<del>奶</del>理工大学官网。</p>
    <p>本站与大连理工大学并无任何官方关联。校徽取自群u <code>微微一奶很龙龙</code>，十分感谢。</p>
    <form method="dialog"><button>知道了</button></form>
  </div>
</dialog>
<script>
(() => {
  const stay = new URLSearchParams(location.search).has('stay'); // 演示用：选了校区也不跳转，重新播放
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DELAY = reduce ? 1200 : 2450; // 阶段B固定时长：进度条后 70% + logo 扫色（ms）
  const EXIT = reduce ? 0 : 450;      // 选中扇区后的离场动画时长（ms）
  const CLICK_GUARD = 350;            // 扇区刚出现时忽略点击，免得「跳过动画」的那一下直接点进某个校区

  /* ==================== 校区配置 ====================
     想改成 3 / 4 / 5 个校区：只需在下面数组里增删条目，保存刷新即可。
     - name  校区名（显示在大字）
     - img   校区截图（建议 1920 宽 webp；原始大图见 resource/，用 PIL 等工具转一下）
     - href  点击后跳转的网址
     扇形、射线数量、标签位置都会按数量自动重算，无其它需要改的地方。
     LQIP（模糊占位底图，key 对应上面的 img 路径）：内联 base64、零额外请求，
     清晰图就绪前先以 CSS 背景渲染；换图后想保留该效果，用同款图重生成即可。 */
  const LQIP = {
    "assets/campus-mtgc.webp": "data:image/webp;base64,UklGRqoAAABXRUJQVlA4IJ4AAACQBgCdASowABsAPqFEmUmmJCKhOrZoAMAUCWIAnTAGhFky34M3MmWewRBap5WegR40H2irqozxjws3BfGAAP6jaqQf2BqsxAgUui0mfTJ79ZlNspJpi+29LMamat0FOf3eUHE6vD2OFebbCMp3RCiJuuVcXj3agRTVLLjcgIv3L3fz/xzC0ptPGTIJWX0dEy7SZl644/oz/kvSjChAAA==",
    "assets/campus-cuz.webp": "data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAABwBgCdASowABsAPqU8m0mmIyKhOrmYAMAUiWgAnTNHOred8Q8FvQFgi5xfMJ72B4+/sh8NyXXj2HribgAA/uRYuXZx665g2BQH4f+LxLWo3KP/f3TW0zRMB+FlMhGki73L52AKHJC+1u2Sn4dMWHlRx8Ywniy+zRPNgC25qD6sQLYTYoDhNugkaDQdVzy8JbkdgTCyn0SLEWy5CRErt9J7eC0IQcxmZip1sNF21FXVPgpq4bi9vevKs8sAAA==",
  };
  const UNIV = "奶龙传媒学院";
  const CAMPUSES = [
    { name: "媒体工程学院", img: "assets/campus-mtgc.webp", href: "https://mtgc.cuz.edu.cn/" },
    { name: "总校官网",     img: "assets/campus-cuz.webp",  href: "https://www.cuz.edu.cn/" },
  ];
  /* ================================================= */

  const body = document.body;
  body.style.setProperty('--delay', DELAY + 'ms');
  if (stay) document.getElementById('hint').textContent += '（演示模式，不会真的跳转）';

  /* ---------- 按配置生成 N 个扇区 + N 条射线（替换静态兜底） ---------- */
  const wheel = document.querySelector('.wheel');
  const N = CAMPUSES.length;
  const R = 150;  // 扇形顶点距离（vmax）
  const D = 27;   // 标签距中心距离（vmin）
  const rad = d => d * Math.PI / 180;
  // 极坐标 -> calc() 坐标点（屏幕坐标：0° 向右，顺时针为正）
  const fmt = (v, unit) => (v < 0 ? `- ${(-v).toFixed(2)}${unit}` : `+ ${v.toFixed(2)}${unit}`);
  const pt = deg => { const a = rad(deg); return `calc(50% ${fmt(R * Math.cos(a), 'vmax')}) calc(50% ${fmt(R * Math.sin(a), 'vmax')})`; };
  const labelPos = (deg, d) => { const a = rad(deg); return `left: calc(50% ${fmt(d * Math.cos(a), 'vmin')}); top: calc(50% ${fmt(d * Math.sin(a), 'vmin')})`; };

  let html = '';
  for (let i = 0; i < N; i++) {
    const c = (270 - i * 360 / N + 360) % 360;   // 第 i 个扇区的中线角度：270° 起，依次均分
    const h = 180 / N;                            // 每个扇区半角
    const clip = N === 1 ? 'none' : `polygon(50% 50%, ${pt(c - h)}, ${pt(c)}, ${pt(c + h)})`;
    const c2 = CAMPUSES[i];
    const bg = LQIP[c2.img]; // 模糊占位底图（内联，零请求）
    html += `<a class="sector" href="${c2.href}" aria-label="${UNIV}${c2.name}" style="clip-path: ${clip}${bg ? `; background-image: url(${bg})` : ''}">`
          + `<img src="${c2.img}" alt="" width="1920" height="1090">`
          + `<span class="sector-label" style="${labelPos(c, D)}"><small>${UNIV}</small><b>${c2.name}</b></span></a>`;
  }
  for (let i = 0; i < N; i++) {                   // 射线 = 相邻扇区的边界
    const b = (270 - i * 360 / N - 180 / N + 360) % 360;
    html += `<i class="ray" style="--a: ${b.toFixed(2)}deg"></i>`;
  }
  wheel.innerHTML = html;

  // 清晰截图加载完再加 .loaded 触发淡入；缓存已就绪的直接显示
  wheel.querySelectorAll('img').forEach(img => {
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
  });

  const sectorsNav = document.querySelector('.sectors');
  const sectors = [...document.querySelectorAll('.sector')];
  const aboutBtn = document.getElementById('about-btn');
  const about = document.getElementById('about');
  aboutBtn.hidden = false; // 没有 JS 时弹窗打不开，按钮也就不显示

  let state, timer, deadline, remaining, chooseAt = 0; // state: intro → choosing → leaving

  function arm(ms) {
    deadline = performance.now() + ms;
    timer = setTimeout(choose, ms);
  }

  function start() {
    state = 'intro';
    body.classList.remove('run', 'ready', 'choosing', 'leaving', 'paused');
    sectors.forEach(a => a.classList.remove('picked'));
    sectorsNav.style.setProperty('--spin-at', Math.random().toFixed(4)); // 转盘的随机初始角度
    void body.offsetWidth; // 重新触发 CSS 动画
    body.classList.add('run');
    if (logosDone) markReady(); // 图片早已解码（如 ?stay 重播）：直接进入阶段B
  }

  /* 阶段A → B 的切换：两张 logo 都解码完成后，进度条从当前位置走完剩余部分（固定时长），logo 同步登场 */
  let logosDone = false;
  function markReady() {
    if (state !== 'intro' || body.classList.contains('ready')) return;
    logosDone = true;
    const t = getComputedStyle(document.querySelector('.bar')).transform;
    const sx = t === 'none' ? 0 : Math.max(0, parseFloat(t.slice(7, -1).split(',')[0]) || 0);
    body.style.setProperty('--bar-from', sx.toFixed(4)); // fillbar 从进度条当前位置无缝续走
    body.classList.add('ready');
    if (!body.classList.contains('paused')) arm(DELAY); // 「关于」开着时先不倒计时，关闭后再继续
  }
  Promise.all([...document.querySelectorAll('.logo-box img')].map(i => i.decode().catch(() => {})))
    .then(markReady);
  setTimeout(markReady, 4000); // decode() 迟迟不返回的兜底

  function choose(viaKey) {
    if (state !== 'intro') return;
    state = 'choosing';
    clearTimeout(timer);
    chooseAt = performance.now();
    body.classList.add('choosing');
    if (viaKey === true) sectors[0].focus();
  }

  function leave(link) {
    state = 'leaving';
    link.classList.add('picked');
    body.classList.add('leaving');
    setTimeout(stay ? start : () => { location.href = link.href; }, stay ? EXIT + 600 : EXIT);
  }

  sectors.forEach(a => a.addEventListener('click', e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return; // 新标签页打开等交给浏览器
    e.preventDefault();
    if (state !== 'choosing' || performance.now() - chooseAt < CLICK_GUARD) return;
    leave(a);
  }));

  // 从校区网站点「返回」时页面可能是从缓存恢复的，直接回到选校区界面
  addEventListener('pageshow', e => {
    if (!e.persisted || state !== 'leaving') return;
    state = 'choosing';
    body.classList.remove('leaving');
    sectors.forEach(a => a.classList.remove('picked'));
  });

  // 开场阶段打开「关于」时暂停倒计时和进度条，关闭后从剩余时间继续
  aboutBtn.addEventListener('click', () => {
    if (state === 'leaving') return;
    if (state === 'intro') {
      clearTimeout(timer);
      remaining = deadline ? Math.max(0, deadline - performance.now()) : DELAY; // 阶段A还没走完时按整段B计
      body.classList.add('paused');
    }
    about.showModal();
  });
  about.addEventListener('close', () => {
    if (!body.classList.contains('paused')) return;
    body.classList.remove('paused');
    if (state !== 'intro') return;
    if (body.classList.contains('ready')) arm(remaining); // 还没 ready 的话，markReady 解锁后会自己 arm
  });
  about.addEventListener('click', e => { if (e.target === about) about.close(); }); // 点遮罩关闭

  // 开场阶段点击或按键直接切到选校区；「关于」相关的操作和 Tab、修饰键除外
  const IGNORED_KEYS = ['Tab', 'Shift', 'Control', 'Alt', 'Meta'];
  function skip(e) {
    if (state !== 'intro' || about.open || aboutBtn.contains(e.target)) return;
    if (e.type === 'keydown' && IGNORED_KEYS.includes(e.key)) return;
    choose(e.type === 'keydown');
  }
  addEventListener('pointerdown', skip);
  addEventListener('keydown', skip);
  start();
})();
</script>
</body>
</html>
