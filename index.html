<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>奶龙传媒学院 · 敬请期待</title>

<meta name="theme-color" content="#fece0e">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #fffbef;
    color: #2b2410;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { text-align: center; max-width: 480px; }
  h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: 2px; }
  .sub { margin-top: 8px; font-size: 18px; color: #6b5d2e; }
  .btn {
    display: inline-block;
    margin: 28px 0 8px;
    padding: 14px 36px;
    border-radius: 999px;
    background: #fece0e;
    color: #2b2410;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(254, 206, 14, .45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(254, 206, 14, .55); }
  .btn:active { transform: translateY(0); }
  .qq { margin-top: 28px; }
  .qq img {
    height: 300px;
    max-height: 55vh;
    width: auto;
    border-radius: 12px;
    border: 1px solid #ecd98a;
  }
  .qq p { margin-top: 8px; font-size: 14px; color: #6b5d2e; }
  .repo {
    display: inline-block;
    margin-top: 20px;
    font-size: 14px;
    color: #8a6d1f;
    text-decoration: none;
    border-bottom: 1px dashed #c9a63d;
  }
  .repo:hover { color: #2b2410; }
  @media (prefers-color-scheme: dark) {
    body { background: #15120a; color: #f3ead0; }
    .sub, .qq p { color: #b9ab7e; }
    .qq img { border-color: #3a3220; }
    .btn { box-shadow: 0 4px 14px rgba(254, 206, 14, .25); }
    .repo { color: #c9b266; }
    .repo:hover { color: #f3ead0; }
  }
</style>
</head>
<body>
<main>
  <h1>奶龙传媒学院</h1>
  <p class="sub">站点建设中 · 敬请期待</p>
  <a class="btn" href="https://test.xn--dpqu5wnyaiyf17sktl.com/">最新进展 →</a>
  <div class="qq">
    <img src="resource/QQ.jpg" alt="奶龙交流 QQ 群">

  </div>
  <a class="repo" href="https://github.com/Zhao-Yicheng/nailongchuanmei">GitHub 仓库</a>

</html>
